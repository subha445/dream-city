
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DREAM CITY | 3D City Builder</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">🏙️ DREAM CITY</div>
    <div class="top-actions">
      <span id="cityStatus">CITY ONLINE</span>
      <button id="dayBtn">☀️ Day</button>
      <button id="nightBtn">🌙 Night</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>Build your city</h2>
      <p class="hint">Choose an object, then tap the ground.</p>

      <div class="tools">
        <button class="tool active" data-tool="select">🖱️ Select</button>
        <button class="tool" data-tool="house">🏠 House</button>
        <button class="tool" data-tool="office">🏢 Office</button>
        <button class="tool" data-tool="tower">🏙️ Skyscraper</button>
        <button class="tool" data-tool="road">🛣️ Road</button>
        <button class="tool" data-tool="tree">🌳 Tree</button>
        <button class="tool" data-tool="park">🌲 Park</button>
        <button class="tool" data-tool="lamp">💡 Street Lamp</button>
      </div>

      <hr>
      <h3>City controls</h3>
      <button id="rotateBtn" class="wide">🔄 Rotate selected</button>
      <button id="deleteBtn" class="wide danger">🗑️ Delete selected</button>
      <button id="rainBtn" class="wide">🌧️ Toggle rain</button>
      <button id="saveBtn" class="wide">💾 Save city</button>
      <button id="loadBtn" class="wide">📂 Load city</button>
      <button id="resetBtn" class="wide danger">↻ Reset city</button>

      <div class="stats">
        <h3>City statistics</h3>
        <p>Buildings <strong id="buildingCount">0</strong></p>
        <p>Trees <strong id="treeCount">0</strong></p>
        <p>Roads <strong id="roadCount">0</strong></p>
        <p>Total objects <strong id="totalCount">0</strong></p>
      </div>
    </aside>

    <section class="city-area">
      <div class="canvas-label">
        <span>🌎 YOUR VIRTUAL WORLD</span>
        <span>Drag to rotate · Scroll to zoom</span>
      </div>
      <div id="cityCanvas"></div>
      <div id="message">Welcome to DREAM CITY!</div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
