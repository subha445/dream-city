
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DREAM CITY 2.0</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">🌆 DREAM CITY <span>2.0</span></div>
    <div class="top-actions">
      <button id="dayBtn">☀️ Day</button>
      <button id="nightBtn">🌙 Night</button>
      <button id="rainBtn">🌧️ Rain</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>City Builder</h2>
      <p class="subtitle">Create your dream world</p>

      <h3>🏗️ Buildings</h3>
      <button class="tool active" data-tool="house">🏠 Modern House</button>
      <button class="tool" data-tool="office">🏢 Office</button>
      <button class="tool" data-tool="tower">🌇 Skyscraper</button>
      <button class="tool" data-tool="pool">🏊 Swimming Pool</button>

      <h3>🌳 Nature</h3>
      <button class="tool" data-tool="tree">🌳 Tree</button>
      <button class="tool" data-tool="park">🌲 Park</button>

      <h3>🚗 City Life</h3>
      <button class="tool" data-tool="car">🚗 Car</button>
      <button class="tool" data-tool="person">🚶 Person</button>
      <button class="tool" data-tool="lamp">💡 Streetlight</button>

      <h3>⚙️ Controls</h3>
      <button id="selectBtn">👆 Select</button>
      <button id="rotateBtn">🔄 Rotate</button>
      <button id="deleteBtn">🗑️ Delete</button>
      <button id="saveBtn">💾 Save City</button>
      <button id="loadBtn">📂 Load City</button>
      <button id="resetBtn">♻️ Reset City</button>

      <div class="stats">
        <h3>📊 City Stats</h3>
        <p>Buildings: <span id="buildingCount">0</span></p>
        <p>Trees: <span id="treeCount">0</span></p>
        <p>Objects: <span id="objectCount">0</span></p>
      </div>
    </aside>

    <section class="city-area">
      <div class="city-heading">
        <div>
          <h2>My Dream City</h2>
          <p>Build • Explore • Create</p>
        </div>
        <div id="status">Ready to build!</div>
      </div>
      <div id="cityCanvas"></div>
      <div class="bottom-hint">
        🖱️ Drag to explore · Tap to build · Pinch to zoom
      </div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
