
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DREAM CITY 4.0</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header>
    <h1>🌆 DREAM CITY 4.0</h1>
    <p>REALISTIC OPEN WORLD</p>
    <div class="top-controls">
      <button id="dayBtn">☀️ Day</button>
      <button id="nightBtn">🌙 Night</button>
      <button id="rainBtn">🌧️ Rain</button>
      <button id="exploreBtn">🚶 Explore</button>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <h2>BUILD YOUR CITY</h2>
      <button data-tool="house">🏠 Houses</button>
      <button data-tool="office">🏢 Offices</button>
      <button data-tool="tower">🏙️ Skyscrapers</button>
      <button data-tool="mall">🛍️ Shopping Mall</button>
      <button data-tool="hospital">🏥 Hospital</button>
      <button data-tool="school">🏫 School</button>
      <button data-tool="airport">✈️ Airport</button>
      <button data-tool="station">🚆 Railway Station</button>
      <button data-tool="park">🌳 Park</button>
      <button data-tool="lake">🌊 Lake</button>
      <button data-tool="beach">🏖️ Beach</button>
      <button data-tool="bridge">🌉 Bridge</button>
      <button data-tool="car">🚗 Car</button>
      <button data-tool="traffic">🚦 Traffic Signal</button>

      <h2>EDIT CITY</h2>
      <button id="selectBtn">Select</button>
      <button id="rotateBtn">Rotate</button>
      <button id="deleteBtn">Delete</button>
      <button id="saveBtn">💾 Save</button>
      <button id="loadBtn">📂 Load</button>
      <button id="resetBtn">Reset City</button>
    </aside>

    <section id="cityArea">
      <div id="stats">
        Buildings: <span id="buildingCount">0</span> |
        Trees: <span id="treeCount">0</span> |
        Objects: <span id="objectCount">0</span>
      </div>
      <div id="cityCanvas"></div>
      <p id="status">Welcome to DREAM CITY 4.0</p>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
